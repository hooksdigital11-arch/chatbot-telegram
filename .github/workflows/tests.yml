name: Testes

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Executar testes offline
        run: python -m unittest discover -s tests -v
      - name: Validar JSON do workflow
        run: python -m json.tool workflow-chatbot-telegram.json > /dev/null
      - name: Testar expressões e Code node do workflow
        run: node --test tests/workflow_code.test.js
